<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="images/png" sizes="32x32" href="images/favicon-32x32.png">
  <title>
     Frontend Mentor | Stats preview card component
  </title>
  <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main>
   <section class="card">
     <div class="content">
     <header>
      <h1 class="header">
        Get <span class="span-header">insights</span> that help your business grow.
      </h1>
     </header>
   
    <p class="paragraph">
     Discover the benefits of data analytics and make better decisions regarding revenue, customer 
      experience, and overall efficiency.
    </p>
    <div class="stats">
     <div class="stat">
       <p class="card-number">10K+</p>
       <p class="card-name">companies</p>
     </div>
     
     <div class="stat">
       <p class="card-number">314</p>
       <p class="card-name">templates</p>
     </div>
     
     <div class="stat">
       <p class="card-number">12M+</p>
       <p class="card-name">queries</p>
     </div>
     </div>
     </div>
     
     <div class="image">
       <img src="images/image-header-desktop.jpg" alt="Women working in an office with laptop.">
     </div>
     
     <div class="image2">
      <img src="images/image-header-mobile.jpg" alt="Women working in an office with laptop">
     </div>
   </section>
     <footer class="attribution">
       Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
       Coded by <a href="https://github.com/Gbemmydrazortech">Akoniyon Aliu Oluwagbemi</a>.
     </footer>
  </main>
</body>

</html>
